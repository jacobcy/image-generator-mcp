[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "image-gen-mcp"
version = "0.2.0"
description = "A tool to generate cover images using an external API."
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

dependencies = [
    "requests>=2.28.2",
    "pillow>=10.0.0",
    "pyperclip>=1.8.2",
    "colorlog>=6.9.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.24.4",
    "tqdm>=4.67.1",
    "typer>=0.15.2",
    "openai>=1.76.0",
    "fastmcp>=3.0.0rc2",
]

[project.scripts]
mcp-server = "image_gen_mcp.main:main"

[tool.mcp-server]
# MCP 服务器配置
description = "Cell Cover Generator MCP Server"
command = "image_gen_mcp"

[tool.setuptools]
packages = {find = {}}

[dependency-groups]
dev = [
    "pytest>=9.0.2",
]
